apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qa-namespace
namePrefix: qa-

labels:
  - includeSelectors: false
    pairs:
      environment: qa

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: serviceportal-backend
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: serviceportal-backend

replicas:
  - name: serviceportal-backend
    count: 2
