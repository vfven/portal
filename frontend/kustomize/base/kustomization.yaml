apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Manifests base del DevOps Portal Backend (API Node/Express).
# Los overlays (dev/qa/prod) sobrescriben namespace, host del Ingress,
# conexión a base de datos y réplicas.

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - configmap.yaml
  - secret.yaml

# Labels estándar recomendados por Kubernetes
# (includeSelectors: false → no se agregan al selector del Deployment,
#  que es inmutable; sí se agregan a metadata.labels de todos los recursos).
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: serviceportal-backend
      app.kubernetes.io/managed-by: kustomize

# Pin de la imagen — el pipeline reemplaza el 'newTag' con el IMAGE_TAG real
# via: kustomize edit set image serviceportal-backend=<ECR_REGISTRY>/serviceportal-backend:${IMAGE_TAG}
images:
  - name: serviceportal-backend
    newName: serviceportal-backend
    newTag: placeholder
