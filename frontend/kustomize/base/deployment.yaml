# Deployment del API backend (DevOps Portal).
# Puerto: 3000 (viene del Dockerfile, ENV PORT=3000).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceportal-backend
  labels:
    app: serviceportal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serviceportal-backend
  template:
    metadata:
      labels:
        app: serviceportal-backend
    spec:
      containers:
        - name: serviceportal-backend
          # Placeholder — el pipeline reescribe el tag real via
          # `kustomize edit set image serviceportal-backend=<ECR>/serviceportal-backend:<TAG>`
          # (ver sección `images:` en base/kustomization.yaml).
          image: serviceportal-backend:placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            # DB_* vienen del overlay (cambian por ambiente)
            # DB_PASSWORD se inyecta como secret (ver overlay)
          envFrom:
            # Configuración no sensible (SMTP_HOST/PORT, JIRA_DOMAIN, etc.)
            - configMapRef:
                name: backend-config
            # Credenciales (JIRA_API_TOKEN, SMTP_USER, SMTP_PASS).
            # El Secret 'backend-secrets' debe crearse en el cluster con kubectl
            # (ver instrucciones en base/secret.yaml).
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      imagePullSecrets:
        - name: ecr-registry-secret
