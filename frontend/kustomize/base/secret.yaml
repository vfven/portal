# ============================================================================
# PLACEHOLDER — NO contiene valores reales.
#
# Este archivo existe solo para que Kustomize sepa que el Deployment consume
# un Secret llamado `backend-secrets`. Los VALORES REALES deben crearse en
# cada cluster/namespace manualmente con kubectl, por ejemplo:
#
#   kubectl -n dev-serviceportal create secret generic backend-secrets \
#     --from-literal=JIRA_API_TOKEN='<pegar-aqui-el-token-de-id.atlassian.com>' \
#     --from-literal=SMTP_USER='<usuario-smtp>' \
#     --from-literal=SMTP_PASS='<password-smtp>'
#
# Para rotar un valor:
#   kubectl -n dev-serviceportal create secret generic backend-secrets \
#     --from-literal=JIRA_API_TOKEN='<nuevo-token>' ... \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Importante: si el Secret no existe en el namespace, el pod quedará en
# estado `CreateContainerConfigError` hasta que lo crees.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  # Valores vacíos a propósito — se setean en el cluster con kubectl (ver arriba).
  # Si querés testear localmente con valores dummy, podés poner cualquier string
  # NO COMMITEES NUNCA valores reales acá.
  JIRA_API_TOKEN: ""
  SMTP_USER: ""
  SMTP_PASS: ""
