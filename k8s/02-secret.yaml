# ═══════════════════════════════════════════════════
# Secret — credenciales sensibles
# ───────────────────────────────────────────────────
# IMPORTANTE:
#  - "stringData" permite escribir los valores en texto
#    plano; K8s los codifica en base64 al aplicarlo.
#  - NO commitear este archivo con valores reales.
#    Mejor: usar sealed-secrets, External Secrets Operator
#    o Vault Injector cuando esté en PROD.
# ═══════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: devops-portal
type: Opaque
stringData:
  SMTP_PASS: "REEMPLAZAR"
  JIRA_API_TOKEN: "REEMPLAZAR"
