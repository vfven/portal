# Patch de PROD: host público + TLS con cert-manager.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serviceportal-frontend
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - portal.bancobase.com
      secretName: serviceportal-frontend-tls
  rules:
    - host: portal.bancobase.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serviceportal-frontend
                port:
                  number: 80
