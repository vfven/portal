# Patch de PROD: recursos completos para el portal público.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceportal-frontend
spec:
  template:
    spec:
      containers:
        - name: serviceportal-frontend
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
