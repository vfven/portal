# Patch de DEV: recursos reducidos.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceportal-frontend
spec:
  template:
    spec:
      containers:
        - name: serviceportal-frontend
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
