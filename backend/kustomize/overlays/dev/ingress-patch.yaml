apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serviceportal-frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - portal-kubernetes-dev.bancobase.net
      secretName: bancobase.net
  rules:
    - host: portal-kubernetes-dev.bancobase.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serviceportal-frontend
                port:
                  number: 80
