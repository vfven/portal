apiVersion: apps/v1
kind: Deployment
metadata:
  name: serviceportal-frontend
spec:
  template:
    spec:
      containers:
        - name: serviceportal-frontend
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
