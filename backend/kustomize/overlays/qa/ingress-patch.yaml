apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serviceportal-frontend
spec:
  rules:
    - host: portal.kubernetes-qa.bancobase.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serviceportal-frontend
                port:
                  number: 80
