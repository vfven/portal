# Ingress del frontend.
# Es el punto de entrada público del portal (SPA en /).
# host y TLS se cambian por overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: serviceportal-frontend
spec:
  ingressClassName: nginx
  rules:
    - host: portal.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: serviceportal-frontend
                port:
                  number: 80
